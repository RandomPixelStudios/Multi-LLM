[package]
name = "multi-llm"
version = "1.0.5"
description = "Multi LLM - OpenAI-compatible multi-provider proxy with a desktop UI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
futures-util = { version = "0.3", default-features = false }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
base64 = "0.22"
argon2 = "0.5"
fs2 = "0.4"

[features]
# Embeds the built frontend (dist/) into the binary - required for
# production-style builds started outside of `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
