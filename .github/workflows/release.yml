# CI + releases for Multi LLM 2.x
#
#   push / PR          -> tests (server + CLI)
#   tag v*  (or manual)-> CLI binaries attached to a GitHub release
#                         + Docker image ghcr.io/randompixelstudios/multi-llm
#
# install.sh / install.ps1 download the CLI from
#   https://github.com/RandomPixelStudios/Multi-LLM/releases/latest/download/

name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: JS syntax check (web UI)
        run: node --check server/web/app.js

  cli:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  asset: multillm-linux-x86_64.tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, asset: multillm-linux-aarch64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     asset: multillm-windows-x86_64.zip }
          - { os: macos-latest,   target: aarch64-apple-darwin,       asset: multillm-macos-aarch64.tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,        asset: multillm-macos-x86_64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release --locked -p multillm"
          strip: true
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }} multillm
          cd ../../..
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/multillm.exe -DestinationPath ${{ matrix.asset }}
          (Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" | Out-File -Encoding ascii ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'cli-latest' }}
          make_latest: true
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/randompixelstudios/multi-llm
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
