[package]
name = "multillm-server"
description = "Multi LLM server - OpenAI-compatible multi-provider proxy with web UI (Docker)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "multillm-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
argon2 = "0.5"
rust-embed = "8"
mime_guess = "2"
sha2 = "0.10"
rand = "0.8"
url = "2"
