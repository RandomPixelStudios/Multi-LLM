# Multi LLM als Docker-App (Multi-User, ein Port).
#
# Architektur: Ein Prozess auf Port 5000 hält alle Profile. Jede Anfrage
# wird per API-Key (Inference, /v1/*) bzw. Session-Cookie (Verwaltung, /api/*)
# dem richtigen Benutzer zugeordnet - alle arbeiten gleichzeitig.
#
# Start (aus diesem Verzeichnis):   docker compose up --build -d
# Status / Logs:                    docker compose ps / docker compose logs -f
# Stopp:                            docker compose stop
# Stopp + Entfernen:                docker compose down
#
# Danach erreichbar:
#   - lokal:          http://localhost:5000   (Login-Pflicht!)
#   - andere PCs:     http://<IP-DIESES-RECHNERS>:5000
#     (ggf. Firewall-Regel für Port 5000 auf diesem Rechner freigeben,
#      z. B. `ufw allow 5000/tcp`)
#
# WICHTIG: `restart: "no"` - der Container startet nach einem Systemstart
# NICHT automatisch. Zum manuellen Start: `docker compose start`.

services:
  multillm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: multillm:latest
    container_name: multillm
    ports:
      # Ein Port für alle Benutzer (fest, nicht änderbar).
      - "5000:5000"
    environment:
      MULTI_LLM_DATA_DIR: /data
      MULTI_LLM_PORT: 5000
      # 0.0.0.0-Bind im Container, sonst wäre der Port von außen unerreichbar.
      MULTI_LLM_EXPOSE: 1
      # Single-Port-Multi-User-Modus (Profile pro Key/Session).
      MULTI_LLM_SERVER: 1
    volumes:
      # Alle Benutzerdaten (Konten, Provider, Models, Keys, Usage) überleben
      # Container-Updates und -Neustarts (pro Benutzer unter /data/users/<name>/).
      - multillm-data:/data
    # Kein automatischer Start nach Systemstart - nur manuell.
    restart: "no"

volumes:
  multillm-data:
